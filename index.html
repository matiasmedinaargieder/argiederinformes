<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herramientas de ahorro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logoargieder.png">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#ffffff;
    color:#000000;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:max(24px,env(safe-area-inset-top,0px));
    padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
    position: relative;
    overflow: hidden;
  }

  /* Imagen de fondo con opacidad baja centrada detrás de todo */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('logoargieder.png');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 350px auto; /* Puedes ajustar el tamaño del logo aquí */
    opacity: 0.1; /* Controla la opacidad (0.1 es sutil; súbelo a 0.2 si lo quieres un poco más visible) */
    z-index: 0;
  }

  main{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:28px;
    position: relative; /* Asegura que el contenido quede por encima del fondo */
    z-index: 1;
  }
  h1{
    margin:0;
    font-size:26px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.01em;
    color:#000000;
  }
  .btns{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .btn{
    display:block;
    width:100%;
    padding:16px 20px;
    border-radius:12px;
    background:#fec530;
    color:#000000;
    font:inherit;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    text-align:center;
    transition:background .15s, transform .1s;
  }
  .btn:hover{background:#FF9500}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:3px solid #000000;outline-offset:3px}
  @media(max-width:480px){
    h1{font-size:22px}
  }
</style>
</head>
<body>
  <main>
    <h1>Selecciona la herramienta que quieras usar</h1>
    <div class="btns">
      <a class="btn" href="completo/">Informe completo de ahorro</a>
      <a class="btn" href="resumido/">Informe resumido de ahorro</a>
    </div>
  </main>
</body>
</html>
